<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img">
<title>Suma gráfica de los vectores u y v</title>
<desc>Plano con cuadrícula. El vector u = (2, 1) parte del origen en azul. El vector v = (1, 3) parte de la punta de u en bermellón. El vector resultante u + v = (3, 4) va desde el origen hasta la punta de v en verde.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #374151; }
.ts { font-size: 12px; }
.th { font-size: 14px; font-weight: 600; }
</style>
<defs>
<marker id="flechaU" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0072B2"/></marker>
<marker id="flechaV" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D55E00"/></marker>
<marker id="flechaR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#009E73"/></marker>
</defs>
<rect width="480" height="480" fill="#ffffff"/>
<g stroke="#D1D5DB" stroke-width="1">
<line x1="40" y1="80" x2="40" y2="440"/>
<line x1="100" y1="80" x2="100" y2="440"/>
<line x1="160" y1="80" x2="160" y2="440"/>
<line x1="220" y1="80" x2="220" y2="440"/>
<line x1="280" y1="80" x2="280" y2="440"/>
<line x1="340" y1="80" x2="340" y2="440"/>
<line x1="400" y1="80" x2="400" y2="440"/>
<line x1="40" y1="80" x2="400" y2="80"/>
<line x1="40" y1="140" x2="400" y2="140"/>
<line x1="40" y1="200" x2="400" y2="200"/>
<line x1="40" y1="260" x2="400" y2="260"/>
<line x1="40" y1="320" x2="400" y2="320"/>
<line x1="40" y1="440" x2="400" y2="440"/>
</g>
<g stroke="#374151" stroke-width="2">
<line x1="40" y1="380" x2="400" y2="380"/>
<line x1="100" y1="80" x2="100" y2="440"/>
</g>
<text class="ts" x="40" y="398" text-anchor="middle">−1</text>
<text class="ts" x="160" y="398" text-anchor="middle">1</text>
<text class="ts" x="220" y="398" text-anchor="middle">2</text>
<text class="ts" x="280" y="398" text-anchor="middle">3</text>
<text class="ts" x="340" y="398" text-anchor="middle">4</text>
<text class="ts" x="400" y="398" text-anchor="middle">5</text>
<text class="ts" x="92" y="398" text-anchor="end">0</text>
<text class="ts" x="90" y="324" text-anchor="end">1</text>
<text class="ts" x="90" y="264" text-anchor="end">2</text>
<text class="ts" x="90" y="204" text-anchor="end">3</text>
<text class="ts" x="90" y="144" text-anchor="end">4</text>
<text class="ts" x="90" y="84" text-anchor="end">5</text>
<text class="ts" x="90" y="444" text-anchor="end">−1</text>
<line x1="100" y1="380" x2="220" y2="320" stroke="#0072B2" stroke-width="3" marker-end="url(#flechaU)"/>
<line x1="220" y1="320" x2="280" y2="140" stroke="#D55E00" stroke-width="3" marker-end="url(#flechaV)"/>
<line x1="100" y1="380" x2="280" y2="140" stroke="#009E73" stroke-width="3" marker-end="url(#flechaR)"/>
<text class="th" x="150" y="346" text-anchor="end" fill="#0072B2">u = (2, 1)</text>
<text class="th" x="262" y="236" text-anchor="start" fill="#D55E00">v = (1, 3)</text>
<text class="th" x="172" y="262" text-anchor="end" fill="#009E73">u + v = (3, 4)</text>
<text class="ts" x="40" y="468">Escala: cada cuadro de la cuadrícula equivale a 1 unidad</text>
</svg>
