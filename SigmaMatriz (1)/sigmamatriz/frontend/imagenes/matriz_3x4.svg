<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img">
<title>Matriz de 3 filas y 4 columnas</title>
<desc>Matriz con 3 filas y 4 columnas. Primera fila: 1, 2, 3, 4. Segunda fila: 5, 6, 7, 8. Tercera fila: 9, 10, 11, 12. Los números de fila y columna aparecen en los bordes.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #374151; }
.ts { font-size: 12px; text-anchor: middle; }
.tv { font-size: 18px; text-anchor: middle; }
</style>
<rect width="480" height="230" fill="#ffffff"/>
<path d="M92,30 H86 V200 H92" fill="none" stroke="#374151" stroke-width="2"/>
<path d="M468,30 H474 V200 H468" fill="none" stroke="#374151" stroke-width="2"/>
<text class="ts" x="145" y="22">1</text>
<text class="ts" x="235" y="22">2</text>
<text class="ts" x="325" y="22">3</text>
<text class="ts" x="415" y="22">4</text>
<text class="ts" x="78" y="70" style="text-anchor:end">1</text>
<text class="ts" x="78" y="120" style="text-anchor:end">2</text>
<text class="ts" x="78" y="170" style="text-anchor:end">3</text>
<g fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1">
<rect x="100" y="40" width="90" height="50"/>
<rect x="190" y="40" width="90" height="50"/>
<rect x="280" y="40" width="90" height="50"/>
<rect x="370" y="40" width="90" height="50"/>
<rect x="100" y="90" width="90" height="50"/>
<rect x="190" y="90" width="90" height="50"/>
<rect x="280" y="90" width="90" height="50"/>
<rect x="370" y="90" width="90" height="50"/>
<rect x="100" y="140" width="90" height="50"/>
<rect x="190" y="140" width="90" height="50"/>
<rect x="280" y="140" width="90" height="50"/>
<rect x="370" y="140" width="90" height="50"/>
</g>
<text class="tv" x="145" y="71">1</text>
<text class="tv" x="235" y="71">2</text>
<text class="tv" x="325" y="71">3</text>
<text class="tv" x="415" y="71">4</text>
<text class="tv" x="145" y="121">5</text>
<text class="tv" x="235" y="121">6</text>
<text class="tv" x="325" y="121">7</text>
<text class="tv" x="415" y="121">8</text>
<text class="tv" x="145" y="171">9</text>
<text class="tv" x="235" y="171">10</text>
<text class="tv" x="325" y="171">11</text>
<text class="tv" x="415" y="171">12</text>
