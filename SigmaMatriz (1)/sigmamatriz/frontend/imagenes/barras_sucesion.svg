<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img">
<title>Gráfico de barras de los términos a₁ a a₅ de una sucesión</title>
<desc>Cinco barras azules con los valores 2, 4, 6, 8 y 10. Cada barra corresponde al término aₙ, con n de 1 a 5.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #374151; }
.ts { font-size: 12px; }
.th { font-size: 14px; font-weight: 600; }
</style>
<rect width="480" height="340" fill="#ffffff"/>
<line x1="50" y1="60" x2="50" y2="280" stroke="#374151" stroke-width="2"/>
<line x1="50" y1="280" x2="440" y2="280" stroke="#374151" stroke-width="2"/>
<rect x="70" y="240" width="50" height="40" fill="#0072B2"/>
<rect x="145" y="200" width="50" height="80" fill="#0072B2"/>
<rect x="220" y="160" width="50" height="120" fill="#0072B2"/>
<rect x="295" y="120" width="50" height="160" fill="#0072B2"/>
<rect x="370" y="80" width="50" height="200" fill="#0072B2"/>
<text class="th" x="95" y="232" text-anchor="middle">2</text>
<text class="th" x="170" y="192" text-anchor="middle">4</text>
<text class="th" x="245" y="152" text-anchor="middle">6</text>
<text class="th" x="320" y="112" text-anchor="middle">8</text>
<text class="th" x="395" y="72" text-anchor="middle">10</text>
<text class="th" x="95" y="302" text-anchor="middle">a₁</text>
<text class="th" x="170" y="302" text-anchor="middle">a₂</text>
<text class="th" x="245" y="302" text-anchor="middle">a₃</text>
<text class="th" x="320" y="302" text-anchor="middle">a₄</text>
<text class="th" x="395" y="302" text-anchor="middle">a₅</text>
<text class="ts" x="50" y="326">Cada barra muestra el valor de un término de la sucesión.</text>
</svg>
