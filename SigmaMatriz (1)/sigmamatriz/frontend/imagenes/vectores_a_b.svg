<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img">
<title>Vectores A y B en el plano cartesiano</title>
<desc>Plano con cuadrícula de −5 a 5 en ambos ejes. El vector A = (−3, 3) parte del origen hacia el noroeste en azul. El vector B = (−2, −4) parte del origen hacia el suroeste en bermellón.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #374151; }
.ts { font-size: 12px; }
.th { font-size: 14px; font-weight: 600; }
</style>
<defs>
<marker id="flechaA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0072B2"/></marker>
<marker id="flechaB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#D55E00"/></marker>
</defs>
<rect width="680" height="490" fill="#ffffff"/>
<g transform="translate(120,0)">
<g stroke="#D1D5DB" stroke-width="1">
<line x1="40" y1="40" x2="40" y2="400"/>
<line x1="76" y1="40" x2="76" y2="400"/>
<line x1="112" y1="40" x2="112" y2="400"/>
<line x1="148" y1="40" x2="148" y2="400"/>
<line x1="184" y1="40" x2="184" y2="400"/>
<line x1="256" y1="40" x2="256" y2="400"/>
<line x1="292" y1="40" x2="292" y2="400"/>
<line x1="328" y1="40" x2="328" y2="400"/>
<line x1="364" y1="40" x2="364" y2="400"/>
<line x1="400" y1="40" x2="400" y2="400"/>
<line x1="40" y1="40" x2="400" y2="40"/>
<line x1="40" y1="76" x2="400" y2="76"/>
<line x1="40" y1="112" x2="400" y2="112"/>
<line x1="40" y1="148" x2="400" y2="148"/>
<line x1="40" y1="184" x2="400" y2="184"/>
<line x1="40" y1="256" x2="400" y2="256"/>
<line x1="40" y1="292" x2="400" y2="292"/>
<line x1="40" y1="328" x2="400" y2="328"/>
<line x1="40" y1="364" x2="400" y2="364"/>
<line x1="40" y1="400" x2="400" y2="400"/>
</g>
<g stroke="#374151" stroke-width="2">
<line x1="40" y1="220" x2="400" y2="220"/>
<line x1="220" y1="40" x2="220" y2="400"/>
</g>
<text class="ts" x="40" y="240" text-anchor="middle">−5</text>
<text class="ts" x="76" y="240" text-anchor="middle">−4</text>
<text class="ts" x="112" y="240" text-anchor="middle">−3</text>
<text class="ts" x="148" y="240" text-anchor="middle">−2</text>
<text class="ts" x="184" y="240" text-anchor="middle">−1</text>
<text class="ts" x="256" y="240" text-anchor="middle">1</text>
<text class="ts" x="292" y="240" text-anchor="middle">2</text>
<text class="ts" x="328" y="240" text-anchor="middle">3</text>
<text class="ts" x="364" y="240" text-anchor="middle">4</text>
<text class="ts" x="400" y="240" text-anchor="middle">5</text>
<text class="ts" x="206" y="44" text-anchor="end">5</text>
<text class="ts" x="206" y="80" text-anchor="end">4</text>
<text class="ts" x="206" y="116" text-anchor="end">3</text>
<text class="ts" x="206" y="152" text-anchor="end">2</text>
<text class="ts" x="206" y="188" text-anchor="end">1</text>
<text class="ts" x="206" y="260" text-anchor="end">−1</text>
<text class="ts" x="206" y="296" text-anchor="end">−2</text>
<text class="ts" x="206" y="332" text-anchor="end">−3</text>
<text class="ts" x="206" y="368" text-anchor="end">−4</text>
<text class="ts" x="206" y="404" text-anchor="end">−5</text>
<text class="ts" x="210" y="240" text-anchor="end">0</text>
<line x1="220" y1="220" x2="112" y2="112" stroke="#0072B2" stroke-width="3" marker-end="url(#flechaA)"/>
<line x1="220" y1="220" x2="148" y2="364" stroke="#D55E00" stroke-width="3" marker-end="url(#flechaB)"/>
<text class="th" x="98" y="100" text-anchor="end" fill="#0072B2">A = (−3, 3)</text>
<text class="th" x="136" y="384" text-anchor="end" fill="#D55E00">B = (−2, −4)</text>
</g>
<line x1="160" y1="440" x2="192" y2="440" stroke="#0072B2" stroke-width="3"/>
