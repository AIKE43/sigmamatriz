<line x1="400" y1="440" x2="432" y2="440" stroke="#D55E00" stroke-width="3"/>
<text class="ts" x="440" y="444">Vector B (desde el origen)</text>
<text class="ts" x="160" y="476">Escala: cada cuadro de la cuadrícula equivale a 1 unidad</text>
</svg>
