<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaMatriz - Ranking</title>
    <link rel="icon" href="../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../ccs/styles.css">
    <style>
        .ranking table { width: 100%; border-collapse: collapse; }
        .ranking th, .ranking td { border-bottom: 1px solid #ddd; padding: 0.5rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-trophy"></i> Ranking</h1>
            <p class="subtitle">Mejores puntajes de SigmaMatriz</p>
        </header>

        <div class="card ranking">
            <table>
                <thead>
                    <tr><th>Posición</th><th>Jugador</th><th>Mejor puntaje</th></tr>
                </thead>
                <tbody id="cuerpo">
                    <tr><td colspan="3">Cargando...</td></tr>
                </tbody>
            </table>
            <p><a href="inicio.html">Volver al inicio</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cuerpo = document.getElementById('cuerpo');
            try {
                const respuesta = await fetch('/ranking?limite=20');
                const { ranking } = await respuesta.json();

                if (ranking.length === 0) {
                    cuerpo.innerHTML = '<tr><td colspan="3">Aún no hay partidas jugadas.</td></tr>';
                    return;
                }

                cuerpo.innerHTML = '';
                ranking.forEach((jugador, i) => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `<td>${i + 1}</td><td></td><td>${jugador.mejor_puntaje}</td>`;
                    fila.children[1].textContent = jugador.nombre; // evita inyección de HTML
                    cuerpo.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar el ranking:', error);
                cuerpo.innerHTML = '<tr><td colspan="3">No se pudo cargar el ranking.</td></tr>';
            }
        });
    </script>
</body>
</html>
